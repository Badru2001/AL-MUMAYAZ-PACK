<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Viewer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f2f2f2;
}

/* Top bar like WhatsApp */
.header {
    background: #075E54;
    color: white;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
}

/* PDF container */
.viewer {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
}
</style>
</head>

<body>

<div class="header">
📄 My Document
</div>

<iframe src="file.pdf" class="viewer"></iframe>

</body>
</html>
