<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expenso</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    background: white;
    font-family: Arial;
    max-width: 390px;
    margin: auto;
}

/* Inputs */
.input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 8px;
    border: 1px solid black;
    font-size: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 8px;
    border: 1px solid black;
    background: white;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    border: 1px solid black;
    padding: 6px;
    text-align: center;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="input-row">
    <input type="text" id="name" placeholder="Name">
    <input type="number" id="expense" placeholder="Expense">
    <input type="number" id="payable" placeholder="Payable">
    <input type="number" id="receivable" placeholder="Receivable">
</div>

<button onclick="addData()">Add</button>

<table>
<tr>
    <th>Name</th>
    <th>Expense</th>
    <th>Payable</th>
    <th>Receivable</th>
    <th>X</th>
</tr>
<tbody id="data"></tbody>
</table>

<script>
function loadData() {
    let data = JSON.parse(localStorage.getItem("expenso")) || [];
    let html = "";

    data.forEach((item, i) => {
        html += `
        <tr>
            <td>${item.name}</td>
            <td>${item.expense}</td>
            <td>${item.payable}</td>
            <td>${item.receivable}</td>
            <td><button onclick="del(${i})">X</button></td>
        </tr>`;
    });

    document.getElementById("data").innerHTML = html;
}

function addData() {
    let data = JSON.parse(localStorage.getItem("expenso")) || [];

    data.push({
        name: name.value,
        expense: expense.value,
        payable: payable.value,
        receivable: receivable.value
    });

    localStorage.setItem("expenso", JSON.stringify(data));

    name.value = "";
    expense.value = "";
    payable.value = "";
    receivable.value = "";

    loadData();
}

function del(i) {
    let data = JSON.parse(localStorage.getItem("expenso"));
    data.splice(i,1);
    localStorage.setItem("expenso", JSON.stringify(data));
    loadData();
}

loadData();
</script>

</body>
</html>
