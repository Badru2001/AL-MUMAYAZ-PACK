<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenso Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: white;
    max-width: 390px;
    margin: auto;
}

/* Header */
.profile {
    display: flex;
    align-items: center;
    padding: 10px;
}

/* Profile Image */
.profile img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid black;
    object-fit: cover;
}

/* Stats */
.stats {
    display: flex;
    justify-content: space-around;
    flex: 1;
    text-align: center;
}

.stats div {
    border: 1px solid black;
    padding: 5px;
    font-size: 12px;
}

/* Name */
.name {
    padding: 0 10px;
    font-weight: bold;
}

/* Bio */
.bio {
    padding: 10px;
    border-top: 1px solid black;
    border-bottom: 1px solid black;
    font-size: 13px;
}

/* Section title */
.section-title {
    padding: 8px;
    border-bottom: 1px solid black;
    font-size: 14px;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    border: 1px solid black;
    padding: 6px;
    font-size: 12px;
    text-align: center;
}

/* Input */
input {
    width: 100%;
    padding: 6px;
    border: 1px solid black;
    font-size: 12px;
}

button {
    width: 100%;
    padding: 6px;
    border: 1px solid black;
    background: white;
}
</style>
</head>

<body>

<!-- PROFILE -->
<div class="profile">
    <img src="https://via.placeholder.com/150" id="profilePic">
    
    <div class="stats">
        <div>
            <div id="totalExpense">0</div>
            Expense
        </div>
        <div>
            <div id="totalDebit">0</div>
            Debit
        </div>
        <div>
            <div id="totalCredit">0</div>
            Credit
        </div>
    </div>
</div>

<div class="name">Your Name</div>

<div class="bio" contenteditable="true">
    Write your bio / notes here...
</div>

<div class="section-title">Entries</div>

<!-- INPUT -->
<input type="text" id="name" placeholder="Name">
<input type="number" id="expense" placeholder="Expense">
<input type="number" id="debit" placeholder="Debit">
<input type="number" id="credit" placeholder="Credit">
<button onclick="addData()">Add</button>

<!-- TABLE -->
<table>
<tr>
    <th>Name</th>
    <th>Expense</th>
    <th>Debit</th>
    <th>Credit</th>
    <th>X</th>
</tr>
<tbody id="data"></tbody>
</table>

<script>
function loadData() {
    let data = JSON.parse(localStorage.getItem("expenso")) || [];
    let html = "";
    let exp = 0, deb = 0, cre = 0;

    data.forEach((item, i) => {
        exp += Number(item.expense || 0);
        deb += Number(item.debit || 0);
        cre += Number(item.credit || 0);

        html += `
        <tr>
            <td>${item.name}</td>
            <td>${item.expense}</td>
            <td>${item.debit}</td>
            <td>${item.credit}</td>
            <td><button onclick="del(${i})">X</button></td>
        </tr>`;
    });

    document.getElementById("data").innerHTML = html;
    document.getElementById("totalExpense").innerText = exp;
    document.getElementById("totalDebit").innerText = deb;
    document.getElementById("totalCredit").innerText = cre;
}

function addData() {
    let data = JSON.parse(localStorage.getItem("expenso")) || [];

    data.push({
        name: name.value,
        expense: expense.value,
        debit: debit.value,
        credit: credit.value
    });

    localStorage.setItem("expenso", JSON.stringify(data));

    name.value = "";
    expense.value = "";
    debit.value = "";
    credit.value = "";

    loadData();
}

function del(i) {
    let data = JSON.parse(localStorage.getItem("expenso"));
    data.splice(i,1);
    localStorage.setItem("expenso", JSON.stringify(data));
    loadData();
}

loadData();
</script>

</body>
</html>
