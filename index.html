<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenso</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: white;
    max-width: 390px;
    margin: auto;
}

/* PROFILE */
.profile {
    padding: 15px;
}

.profile img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid black;
}

/* NAME */
.name {
    padding-left: 15px;
    font-weight: bold;
}

/* TABS */
.tabs {
    display: flex;
    margin-top: 10px;
}

.tab {
    flex: 1;
    height: 40px;
}

/* Different colors */
.tab:nth-child(1) { background: #ddd; }
.tab:nth-child(2) { background: #bbb; }
.tab:nth-child(3) { background: #999; }
.tab:nth-child(4) { background: #777; }

/* CONTENT */
.content {
    display: none;
    height: 400px;
    border-top: 1px solid black;
}

.active {
    display: block;
}
</style>
</head>

<body>

<!-- PROFILE -->
<div class="profile">
    <img src="https://via.placeholder.com/150">
</div>

<div class="name">Badrudheen</div>

<!-- 4 COLOR ROW -->
<div class="tabs">
    <div class="tab" onclick="showTab(0)"></div>
    <div class="tab" onclick="showTab(1)"></div>
    <div class="tab" onclick="showTab(2)"></div>
    <div class="tab" onclick="showTab(3)"></div>
</div>

<!-- CONTENT AREAS -->
<div id="tab0" class="content active"></div>
<div id="tab1" class="content"></div>
<div id="tab2" class="content"></div>
<div id="tab3" class="content"></div>

<script>
function showTab(n) {
    let tabs = document.querySelectorAll(".content");
    tabs.forEach(t => t.classList.remove("active"));
    document.getElementById("tab"+n).classList.add("active");
}
</script>

</body>
</html>
