<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expenso</title>

<style>
body {
    margin: 10px; /* space outside */
    background: #eee;
    max-width: 390px;
    height: calc(100vh - 20px);
    margin-left: auto;
    margin-right: auto;
    overflow: hidden;
    font-family: Arial;
}

/* MAIN APP BOX */
.app {
    width: 100%;
    height: 100%;
    background: white;
    border: 2px solid black;
    position: relative;
    overflow: hidden;
}

/* BLANK SCREEN */
.main {
    width: 100%;
    height: 100%;
}

/* SIDE PROFILE PANEL */
.profile-panel {
    position: absolute;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100%;
    background: white;
    border-right: 2px solid black;
    transition: 0.3s;
    padding: 15px;
}

/* SHOW PANEL */
.show {
    left: 0;
}

/* PROFILE IMAGE */
.profile-panel img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid black;
}

/* NAME */
.name {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

    <!-- PROFILE PANEL -->
    <div id="panel" class="profile-panel">
        <img src="https://via.placeholder.com/150">
        <div class="name">Badrudheen</div>
    </div>

    <!-- MAIN BLANK SCREEN -->
    <div id="main" class="main"></div>

</div>

<script>
let startX = 0;

let main = document.getElementById("main");
let panel = document.getElementById("panel");

main.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

main.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;

    // swipe right → open
    if (endX - startX > 50) {
        panel.classList.add("show");
    }

    // swipe left → close
    if (startX - endX > 50) {
        panel.classList.remove("show");
    }
});
</script>

</body>
</html>
