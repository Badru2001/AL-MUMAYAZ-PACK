<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expenso</title>

<style>
body {
    margin: 0;
    background: white;
    max-width: 390px;
    height: 100vh;
    margin: auto;
    overflow: hidden;
    font-family: Arial;
    border: 2px solid black;
}

/* MAIN BLANK SCREEN */
.main {
    width: 100%;
    height: 100%;
}

/* SIDE PROFILE PANEL */
.profile-panel {
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: white;
    border-right: 2px solid black;
    transition: 0.3s;
    padding: 15px;
}

/* PROFILE IMAGE */
.profile-panel img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid black;
}

/* NAME */
.name {
    margin-top: 10px;
    font-weight: bold;
}

/* SHOW PANEL */
.show {
    left: 0;
}
</style>
</head>

<body>

<!-- SIDE PROFILE -->
<div id="panel" class="profile-panel">
    <img src="https://via.placeholder.com/150">
    <div class="name">Badrudheen</div>
</div>

<!-- MAIN BLANK -->
<div class="main" id="main"></div>

<script>
let startX = 0;

document.getElementById("main").addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

document.getElementById("main").addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;

    // swipe right
    if (endX - startX > 50) {
        document.getElementById("panel").classList.add("show");
    }

    // swipe left
    if (startX - endX > 50) {
        document.getElementById("panel").classList.remove("show");
    }
});
</script>

</body>
</html>
