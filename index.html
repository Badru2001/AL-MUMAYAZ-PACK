<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Data Sheet</title>

<style>
body {
    font-family: Arial;
    padding: 10px;
    background: #f2f2f2;
}

h2 {
    text-align: center;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: white;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background: black;
    color: white;
}
</style>
</head>

<body>

<h2>My Data Sheet</h2>

<table id="table"></table>

<script>
fetch('data.csv')
.then(res => res.text())
.then(data => {
    const rows = data.trim().split('\n');
    const table = document.getElementById('table');

    rows.forEach((row, i) => {
        const cols = row.split(',');
        const tr = document.createElement('tr');

        cols.forEach(col => {
            const cell = document.createElement(i === 0 ? 'th' : 'td');
            cell.innerText = col;
            tr.appendChild(cell);
        });

        table.appendChild(tr);
    });
});
</script>

</body>
</html>
