<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swipe App</title>

<style>
body {
    margin: 0;
    padding: 10px; /* outer gap */
    background: #fff;
    overflow: hidden;
}

/* OUTER FRAME (ALWAYS VISIBLE) */
.frame {
    width: 100%;
    height: calc(100vh - 20px);
    border: 1.5px solid black; /* equal 4-side border */
    overflow: hidden;
    position: relative;
}

/* INNER SLIDER */
.slider {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.3s ease;
}

/* EACH SCREEN */
.screen {
    width: 100%;
    height: 100%;
    flex-shrink: 0;
    background: white;
}

/* Profile content center */
.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Image */
.profile img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1.5px solid black;
    object-fit: cover;
}

/* Name */
.profile h2 {
    margin-top: 10px;
    font-size: 16px;
    font-weight: normal;
}
</style>
</head>

<body>

<div class="frame" id="app">
    <div class="slider" id="slider">

        <!-- MAIN BLANK -->
        <div class="screen"></div>

        <!-- PROFILE FULL SCREEN -->
        <div class="screen profile">
            <img src="https://via.placeholder.com/150">
            <h2>Badrudheen</h2>
        </div>

    </div>
</div>

<script>
let startX = 0;
let endX = 0;

const app = document.getElementById("app");
const slider = document.getElementById("slider");

/* Touch Start */
app.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

/* Touch End */
app.addEventListener("touchend", e => {
    endX = e.changedTouches[0].clientX;

    // Swipe left → go profile
    if (startX - endX > 50) {
        slider.style.transform = "translateX(-100%)";
    }

    // Swipe right → back
    if (endX - startX > 50) {
        slider.style.transform = "translateX(0)";
    }
});
</script>

</body>
</html>
