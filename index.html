<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4pcs Rotation with Fade & Blur</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
}

.wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 300px;
    position: relative;
    opacity: 0; 
    filter: blur(12px);
    transition: opacity 1s ease, filter 1s ease;
}

.logo-container {
    position: relative;
    width: 100%;
}

#rotatingImage,
#centerImage,
#bottomImage {
    width: 100%;
    filter: blur(12px);
    transition: filter 1s ease;
}

#centerImage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50%;
}

#bottomImage {
    width: 80%;
    margin-top: 10px;
}

@keyframes spin3slow {
    0% { transform: rotate(0deg); }
    70% { transform: rotate(900deg); }
    100% { transform: rotate(1080deg); }
}

@keyframes sharpen {
    0% { filter: blur(12px); }
    100% { filter: blur(0); }
}

.animate #rotatingImage {
    animation: spin3slow 5s forwards, sharpen 5s forwards;
}

.animate #centerImage,
.animate #bottomImage {
    animation: sharpen 5s forwards;
}

#refreshBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    font-size: 16px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#refreshBtn:hover { background-color: #0056b3; }
</style>
</head>
<body>

<button id="refreshBtn">Refresh</button>

<div class="wrapper" id="wrapper">
    <div class="logo-container">
        <img src="4pcs.png" id="rotatingImage" alt="Rotating">
        <img src="square.png" id="centerImage" alt="Center">
    </div>
    <img src="name text.png" id="bottomImage" alt="Text">
</div>

<script>
const wrapper = document.getElementById("wrapper");
const refreshBtn = document.getElementById("refreshBtn");

function playAnimation() {
    // Make sure images are fully visible before starting
    wrapper.style.opacity = 1;
    wrapper.style.filter = "blur(0)";

    // Reset animation by removing class
    wrapper.classList.remove("animate");
    void wrapper.offsetWidth; // trigger reflow

    // Start animation again
    wrapper.classList.add("animate");

    // Optional: fade out after animation ends (remove if you want it fully visible always)
    setTimeout(() => {
        wrapper.style.opacity = 1;  // keep visible fully
        wrapper.style.filter = "blur(0)"; // keep sharp
    }, 5000);
}

// Play animation automatically on first page load
window.addEventListener("load", playAnimation);

// Play animation again on Refresh button click
refreshBtn.addEventListener("click", playAnimation);
</script>

</body>
</html>
