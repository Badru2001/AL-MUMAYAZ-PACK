<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minimal Swipe Profile</title>

<style>
body {
    margin: 0;
    padding: 10px; /* small outer space */
    background: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Main Screen */
.container {
    width: 100%;
    height: calc(100vh - 20px);
    border: 2px solid black;
    background: white;
    position: relative;
    overflow: hidden;
}

/* Profile Panel */
.profile {
    position: absolute;
    top: 0;
    left: -80%; /* hidden */
    width: 80%;
    height: 100%;
    border-right: 2px solid black;
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: 0.3s ease;
}

/* Active (shown) */
.profile.active {
    left: 0;
}

/* Profile Image */
.profile img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid black;
}

/* Name */
.profile h2 {
    margin-top: 10px;
    font-size: 16px;
    font-weight: normal;
}
</style>
</head>

<body>

<div class="container" id="main">

    <div class="profile" id="profile">
        <img src="https://via.placeholder.com/150" alt="Profile">
        <h2>Badrudheen</h2>
    </div>

</div>

<script>
let startX = 0;
let endX = 0;

const main = document.getElementById("main");
const profile = document.getElementById("profile");

/* Touch Start */
main.addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
});

/* Touch End */
main.addEventListener("touchend", function(e) {
    endX = e.changedTouches[0].clientX;

    if (endX - startX > 50) {
        profile.classList.add("active"); // swipe right → open
    }

    if (startX - endX > 50) {
        profile.classList.remove("active"); // swipe left → close
    }
});
</script>

</body>
</html>
