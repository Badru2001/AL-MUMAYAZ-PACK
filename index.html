<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swipe Sheets</title>

<style>
body {
    margin: 0;
    padding: 10px;
    background: #fff;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Wrapper */
.wrapper {
    width: 100%;
    height: calc(100vh - 20px);
    overflow: hidden;
    position: relative;
}

/* Screens */
.screen {
    width: 100%;
    height: 100%;
    border: 1.5px solid black; /* equal thin border */
    background: white;
    position: absolute;
    top: 0;
    left: 0;
    transition: transform 0.3s ease;
}

/* Default screen */
.main {
    z-index: 2;
}

/* Profile screen (hidden right side) */
.profile {
    transform: translateX(100%);
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

/* When active */
.show-profile .main {
    transform: translateX(-100%);
}

.show-profile .profile {
    transform: translateX(0);
}

/* Profile image */
.profile img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1.5px solid black;
    object-fit: cover;
}

/* Name */
.profile h2 {
    margin-top: 10px;
    font-size: 16px;
    font-weight: normal;
}
</style>
</head>

<body>

<div class="wrapper" id="app">

    <!-- Main Blank Screen -->
    <div class="screen main"></div>

    <!-- Profile Full Screen -->
    <div class="screen profile">
        <img src="https://via.placeholder.com/150">
        <h2>Badrudheen</h2>
    </div>

</div>

<script>
let startX = 0;
let endX = 0;

const app = document.getElementById("app");

/* Touch Start */
app.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

/* Touch End */
app.addEventListener("touchend", e => {
    endX = e.changedTouches[0].clientX;

    // Swipe left → open profile
    if (startX - endX > 50) {
        app.classList.add("show-profile");
    }

    // Swipe right → go back
    if (endX - startX > 50) {
        app.classList.remove("show-profile");
    }
});
</script>

</body>
</html>
