<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Center Image Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.sheet {
    width: 90%;
    height: 90%;
    border: 5px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.sheet img {
    max-width: 80%;
    max-height: 80%;
}
</style>

</head>

<body>

<div class="sheet">
    <img src="logo.png">
</div>

</body>
</html>
